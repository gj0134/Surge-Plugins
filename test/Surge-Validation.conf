[General]
loglevel = notify

[Rule]
DOMAIN,sugar.zhihu.com,REJECT-DROP
DOMAIN,zhihu-web-analytics.zhihu.com,REJECT-DROP
URL-REGEX,^https:\/\/www\.zhihu\.com\/commercial_api\/,REJECT-DROP
FINAL,DIRECT

[Script]
知乎网页界面净化 = type=http-response,pattern=^https:\/\/www\.zhihu\.com\/(?!api\/),requires-body=true,max-size=4194304,timeout=5,script-path=../Zhihu-Web-AdBlock.js
知乎网页数据净化 = type=http-response,pattern=^https:\/\/www\.zhihu\.com\/api\/(?:v3\/feed\/topstory\/recommend|v4\/search_v3|v4\/questions\/\d+\/(?:answers|feeds))(?:\?|$),requires-body=true,max-size=2097152,timeout=5,script-path=../Zhihu-Web-AdBlock.js

[MITM]
hostname = www.zhihu.com
