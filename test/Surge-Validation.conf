[General]
loglevel = notify

[Rule]
DOMAIN,sugar.zhihu.com,REJECT
DOMAIN,zhihu-web-analytics.zhihu.com,REJECT
URL-REGEX,^https:\/\/www\.zhihu\.com\/commercial_api\/,REJECT
FINAL,DIRECT

[Script]
知乎网页界面净化 = type=http-response,pattern=^https:\/\/www\.zhihu\.com\/(?!api\/),requires-body=true,max-size=2097152,timeout=5,script-path=../Zhihu-Web-AdBlock.js
知乎信息流广告与盐选过滤 = type=http-response,pattern=^https:\/\/www\.zhihu\.com\/api\/v3\/(?:feed\/topstory\/recommend|moments)(?:\?|$),requires-body=true,max-size=524288,timeout=5,script-path=../Zhihu-Web-AdBlock.js

[MITM]
hostname = www.zhihu.com
