[General]
loglevel = notify

[Rule]
URL-REGEX,^https:\/\/www\.weibo\.com\/ajax\/feed\/getTipsAd(?:\?|$),REJECT
URL-REGEX,^https:\/\/(?:www\.)?weibo\.com\/ajax\/log\/(?:action|read)(?:\?|$),REJECT
DOMAIN,rum.h5.weibo.cn,REJECT
FINAL,DIRECT

[Script]
微博信息流与热搜广告过滤 = type=http-response,pattern=^https:\/\/www\.weibo\.com\/ajax\/(?:feed|statuses|search|side)\/[^?]+(?:\?|$),requires-body=true,max-size=2097152,timeout=5,script-path=../Weibo-Web-AdBlock.js

[MITM]
hostname = www.weibo.com, weibo.com
